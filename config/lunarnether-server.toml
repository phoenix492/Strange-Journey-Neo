#Whether to apply a multiplier to gravity in biomes tagged #lunarnether:lowered_gravity
applyModifiedGravity = true
#Sets the multiplier applied to the gravity on entities in biomes tagged #lunarnether:lowered_gravity.
#Does nothing if applyModifiedGravity is set to false.
#0.5 will be half gravity (weaker), 2 would be double gravity (stronger).
modifiedGravityMultiplier = 0.4
#What method to use for modifying fall damage in accordance with modified gravity.
#NONE: Fall damage is based on amount of blocks fallen, as in vanilla.
#SAFE_FALL_DIV: Amount of distance that is considered "safe" to fall is divided by modifiedGravityMultiplier. Still increases one to one with blocks fallen past the safe distance, but increases/reduces amount of blocks before fall damage starts.
#DISTANCE_MULT: Multiplies the distance the game considers you to have fallen for the purposes of fall damage calculation by modifiedGravityMultiplier. Fall damage increase per block is equal to modifiedGravityMultiplier.
#Allowed Values: NONE, SAFE_FALL_DIV, DISTANCE_MULT
fallDamageReductionMethod = "SAFE_FALL_DIV"
